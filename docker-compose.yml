version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firday-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FIRMWARE_DIR=/app/firmware
    volumes:
      - ./firmware:/app/firmware:ro
      - ./artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firday-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
